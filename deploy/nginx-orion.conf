# Orion on orionagentic.online (the website) and api.orionagentic.online (the API). The old n8n landing page this
# replaces is backed up on the server. The website uses the existing certificate for orionagentic.online.

server {
    server_name orionagentic.online www.orionagentic.online;

    access_log /var/log/nginx/orion.access.log;
    error_log  /var/log/nginx/orion.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build files are cached for a year; pages are never cached
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/orionagentic.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orionagentic.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name orionagentic.online www.orionagentic.online;
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}

# The API's HTTPS is added by Certbot once api.orionagentic.online points at this server:
#   certbot --nginx -d api.orionagentic.online
server {
    server_name api.orionagentic.online;

    access_log /var/log/nginx/orion-api.access.log;
    error_log  /var/log/nginx/orion-api.error.log;

    # Logos and pictures up to 10 MB each, several per request; the AI can take a while to answer
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    listen 80;
    listen [::]:80;
}
