[project]
name = "orion"
version = "0.1.0"
description = "Orion backend: AI-guided custom product ordering and manufacturer communication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langchain-openai",
    "psycopg[binary,pool]",
    "pydantic[email]",
    "pydantic-settings",
    "alembic>=1.20.1",
    "sqlalchemy>=2.1.6",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
